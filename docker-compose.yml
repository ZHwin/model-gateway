services:
  model-gateway:
    build: .
    image: kuakuaqun/model-gateway:latest
    container_name: model-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化配置：providers.json / config.json / history / usage 等
      - ./data:/data
    environment:
      - GATEWAY_DATA_DIR=/data
      # —— 飞牛 NAS 内存优化（按需调整）——
      # 历史与用量数据保留天数（默认 30 天，飞牛建议 7 天以减小磁盘与清理时的内存峰值）
      - GATEWAY_MAX_HISTORY_DAYS=7
      - GATEWAY_MAX_USAGE_DAYS=7
      # 上游并发连接池上限（默认 30 / keepalive 10，足够飞牛使用）
      - GATEWAY_MAX_CONNECTIONS=30
      - GATEWAY_MAX_KEEPALIVE=10
      # 健康轮询间隔（秒），默认 300
      - GATEWAY_POLL_INTERVAL=300
    # 内存上限兜底，防止异常时拖垮 NAS；如内存非常紧张可降到 256m
    mem_limit: 512m
    memswap_limit: 512m
    # 飞牛常用存储优化：关闭匿名页交换，减少 swap 抖动
    mem_swappiness: 10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
